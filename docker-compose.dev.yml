# Local development infrastructure only (the app itself runs via `pnpm dev`).
# Self-host compose (app included) arrives with MN-031 as docker-compose.yml.
name: storyos-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storyos
      POSTGRES_PASSWORD: storyos
      POSTGRES_DB: storyos
    ports:
      - "5432:5432"
    volumes:
      - storyos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyos"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Fake SMTP: catches all outgoing email (invites, mentions, resets).
  # Web inbox at http://localhost:8025, SMTP at localhost:1025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # PDF renderer for local development (#874) — OFF unless asked for:
  #   docker compose -f docker-compose.dev.yml --profile pdf up -d
  # then run the API with PDF_RENDERER_URL=http://127.0.0.1:3010.
  #
  # DELIBERATELY NOT ISOLATED here, unlike docker-compose.yml: in dev the API runs on
  # your HOST, and a host process cannot reach a container on an `internal: true`
  # network. So this publishes a port — bound to 127.0.0.1 only, never your LAN. That is
  # fine for a laptop and WRONG for a server: never copy this block into a deployed file.
  # Keep the image tag and settings in step with docker-compose.yml's `gotenberg`.
  gotenberg:
    image: gotenberg/gotenberg:8.38.1
    profiles: [pdf]
    mem_limit: 1g
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      CHROMIUM_MAX_CONCURRENCY: "1"
      API_TIMEOUT: "25s"
      CHROMIUM_DISABLE_JAVASCRIPT: "true"
      API_DISABLE_DOWNLOAD_FROM: "true"
      WEBHOOK_DISABLE: "true"
      LIBREOFFICE_DISABLE_ROUTES: "true"

volumes:
  storyos_pg_data:
