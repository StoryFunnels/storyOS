name: Publish @storyos/runner to npm

# Publishes the Runner when a tag like `runner-v0.1.0` is pushed. Tag-only: there
# is no workflow_dispatch and nothing here runs on a branch or a pull request.
# The job runs in the `npm-publish` environment, which holds NPM_TOKEN.
#
# This is a second workflow, not a second tag in npm-publish.yml, on purpose:
# each package keeps its own tag filter, so one tag publishes one package.
#
# Settings mirror npm-publish.yml: same pinned actions, Node 22, NPM_TOKEN handed
# to the publish step only as NODE_AUTH_TOKEN, and contents: read (no id-token,
# no provenance). Extra guard here: the tag version must equal
# packages/runner/package.json version. Both workflows also require the tagged
# commit to be on main.
on:
  push:
    tags:
      - 'runner-v*'

permissions:
  contents: read

jobs:
  publish:
    if: github.ref_type == 'tag'
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit that has been merged."
            exit 1
          fi
      - name: Tag version equals packages/runner/package.json version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG_NAME#runner-v}"
          PKG_VERSION="$(node -p "require('./packages/runner/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG_NAME says $TAG_VERSION but packages/runner/package.json says $PKG_VERSION. Fix one, re-tag."
            exit 1
          fi
          echo "Publishing @storyos/runner $PKG_VERSION"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      # The Runner is Apache-2.0 inside an AGPL repo; CI runs this on every PR,
      # and it is cheap to run once more on the exact commit being published.
      - run: pnpm license:runner
      - run: pnpm build
      - run: pnpm --filter @storyos/runner publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
