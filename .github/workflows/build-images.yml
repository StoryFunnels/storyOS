# Build the three service images on GitHub's runners and push them to GHCR, so
# the (small) production host never builds — it only `docker compose pull`s.
# This removes the OOM-during-build failure mode entirely (a parallel on-box
# `docker compose build` once exhausted RAM and 521'd the site).
#
# Pull side: docker-compose.prod.yml overrides each service's image to the GHCR
# tag. See docs/self-hosting.md → "Deploy from prebuilt images".
name: Build & push images

on:
  # Every landed change to main publishes fresh :latest + :<sha> images.
  push:
    branches: [main]
  # Manual re-publish (e.g. to rebuild :latest without a new commit).
  workflow_dispatch:

# Don't cancel an in-flight publish when another push lands — let each finish so
# a half-pushed tag can't be pulled.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.service }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io via the built-in GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        service: [api, mcp, web]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            cache_suffix: ''
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache_suffix: '-arm64'
          - service: api
            dockerfile: docker/api.Dockerfile
            build_args: ''
          - service: mcp
            dockerfile: docker/mcp.Dockerfile
            build_args: ''
          - service: web
            dockerfile: docker/web.Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
              NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
              NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR image paths must be lowercase; the org login can be mixed-case.
      - name: Compute lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/storyos-${{ matrix.service }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.service }}${{ matrix.cache_suffix }}
          cache-to: type=gha,scope=${{ matrix.service }}${{ matrix.cache_suffix }},mode=max

  merge:
    name: merge manifests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Compute lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One multi-arch manifest per service: :latest and :<sha> now point at
      # BOTH arch images; docker pull picks the right one per machine.
      - name: Create multi-arch manifests
        run: |
          for svc in api mcp web; do
            docker buildx imagetools create \
              -t "ghcr.io/$OWNER_LC/storyos-$svc:latest" \
              -t "ghcr.io/$OWNER_LC/storyos-$svc:${{ github.sha }}" \
              "ghcr.io/$OWNER_LC/storyos-$svc:${{ github.sha }}-amd64" \
              "ghcr.io/$OWNER_LC/storyos-$svc:${{ github.sha }}-arm64"
          done

  # Continuous delivery to the staging VPS: pin IMAGE_TAG to this exact commit,
  # pull, restart, verify from the outside. Rollback = re-run an older run of
  # this workflow (its sha gets pinned again). Prod stays manual for now.
  deploy-staging:
    name: deploy staging
    runs-on: ubuntu-latest
    needs: merge
    timeout-minutes: 10
    permissions:
      contents: read
    # One deploy at a time; a second push queues instead of racing the first.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          install -m 600 /dev/null deploy_key && printf '%s\n' "$SSH_KEY" > deploy_key
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new deploy@${{ secrets.STAGING_HOST }} bash -s <<'EOF'
          set -euo pipefail
          cd ~/storyOS

          # Reclaim BEFORE the pull, not after. On 2026-09-02 this host filled up and
          # every deploy failed for 25 hours at `git pull` with "No space left on
          # device" — while the prune that would have freed it sat at the END of this
          # script, unreachable. A cleanup step that only runs on the happy path cannot
          # rescue the unhappy one. The first failures even LOOKED like a credential
          # problem ("could not read Username for https://github.com"), because a git
          # that cannot write falls back to prompting.
          echo "--- disk before"; df -h / | tail -1
          # Images and build cache only. NEVER --volumes: the postgres data lives in one.
          docker image prune -af --filter "until=168h" || true
          docker builder prune -af --filter "until=168h" || true
          echo "--- disk after"; df -h / | tail -1

          # Fail early and legibly if still critically full, rather than dying mid-pull
          # with an error that points at the wrong thing.
          used=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          if [ "${used:-0}" -ge 95 ]; then
            echo "::error::staging disk still ${used}% full after prune — deploy aborted before it could fail confusingly"
            exit 1
          fi

          git pull --ff-only
          if grep -q '^IMAGE_TAG=' .env; then
            sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/' .env
          else
            echo 'IMAGE_TAG=${{ github.sha }}' >> .env
          fi
          docker compose pull --quiet
          docker compose up -d
          docker image prune -f
          EOF

      - name: Verify rollout
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://staging.storyos.dev/api/docs)
            [ "$code" = "200" ] && echo "staging healthy" && exit 0
            sleep 5
          done
          echo "staging did not come back after deploy" && exit 1
