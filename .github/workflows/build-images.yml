# Build the three service images on GitHub's runners and push them to GHCR, so
# the (small) production host never builds — it only `docker compose pull`s.
# This removes the OOM-during-build failure mode entirely (a parallel on-box
# `docker compose build` once exhausted RAM and 521'd the site).
#
# Pull side: docker-compose.prod.yml overrides each service's image to the GHCR
# tag. See docs/self-hosting.md → "Deploy from prebuilt images".
name: Build & push images

on:
  # Every landed change to main publishes fresh :latest + :<sha> images.
  push:
    branches: [main]
  # Manual re-publish (e.g. to rebuild :latest without a new commit).
  workflow_dispatch:

# Don't cancel an in-flight publish when another push lands — let each finish so
# a half-pushed tag can't be pulled.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io via the built-in GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: docker/api.Dockerfile
            build_args: ''
          - service: mcp
            dockerfile: docker/mcp.Dockerfile
            build_args: ''
          # web bakes NEXT_PUBLIC_* into the client bundle at BUILD time
          # (Next.js constraint), so the prod values must be present here — set
          # them as repo Actions *variables* (Settings → Secrets and variables →
          # Actions → Variables). Absent ⇒ analytics simply stays off.
          - service: web
            dockerfile: docker/web.Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
              NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
              NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR image paths must be lowercase; the org login can be mixed-case.
      - name: Compute lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/storyos-${{ matrix.service }}:latest
            ghcr.io/${{ env.OWNER_LC }}/storyos-${{ matrix.service }}:${{ github.sha }}
          # Share the layer cache with the CI `images` job (same scopes).
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
