# Developer Certificate of Origin check (MN-237).
#
# Every external contributor's commit must carry a `Signed-off-by:` trailer
# (git commit -s). Per CLA.md, that sign-off is also their acceptance of the
# Contributor License Agreement, so this IS the CLA gate. (A separate cla-assistant
# workflow, cla.yml, was removed in #953: it was never activated and its own `if:`
# was invalid, so it failed on every push.)
#
# Maintainers and bots are allow-listed so internal PRs are never blocked.
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # #1127 — so `dco` can be a required check: the merge queue waits for every
  # required check on its own merge_group run, and a check that never reports
  # there stalls the queue until it times out. The commits were already checked
  # on the PR before it could enter the queue, so that run only reports success.
  merge_group:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge queue — commits were checked on the PR
        if: github.event_name == 'merge_group'
        run: echo "DCO was checked on the pull request before it entered the queue."

      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check Signed-off-by on every commit
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Maintainers/bots don't need a sign-off; external contributors do.
          #
          # #1127 — matched on the GitHub login that OPENED the PR, which GitHub
          # authenticates. It used to match each commit's author name and email,
          # but those are whatever the committer typed into git config, so
          # writing a maintainer's name into a commit skipped the CLA gate.
          # (A commit's linked GitHub account is derived from that same email,
          # so it is no better.) A maintainer's PR is exempt as a whole; anyone
          # else's PR needs a sign-off on every commit, whoever the commit names.
          #
          # History: before that, this compared a space-separated list of LOGINS
          # against the author NAME, so it failed on every internal commit for
          # weeks unnoticed, because DCO was not a required check (#777).
          MAINTAINERS='ikrasovytskyi|IllyaMoore|dependabot\[bot\]|github-actions\[bot\]'
          if printf '%s' "$PR_AUTHOR" | grep -qxE "$MAINTAINERS"; then
            echo "DCO skipped — PR opened by maintainer/bot '$PR_AUTHOR'."
            exit 0
          fi
          fail=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            if git show -s --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              continue
            fi
            echo "::error::commit $sha by '$(git show -s --format='%an' "$sha")' has no Signed-off-by trailer."
            echo "  Fix: git commit --amend -s   (or git rebase --signoff). See CONTRIBUTING.md / CLA.md."
            fail=1
          done
          if [ "$fail" -eq 0 ]; then echo "DCO OK — all commits signed off."; else exit 1; fi
