name: Publish @storyos/mcp to npm

# Publishes the MCP package when a tag like `mcp-v0.1.0` is pushed. Tag-only.
# The job runs in the `npm-publish` environment and publishes with npm trusted
# publishing: the job's short-lived OIDC identity (`id-token: write`, granted on
# the publish job only) is exchanged for publish rights, and the release carries
# provenance. There is no stored npm credential anywhere in this workflow.
# The package is built and bundled explicitly (pack does not run
# prepublishOnly), then packed and published as a tarball, so the published
# file list is the package's own `files` rules. The tagged commit must already
# be on main, and the tag version must equal packages/mcp/package.json version.
on:
  push:
    tags:
      - 'mcp-v*'

permissions:
  contents: read

jobs:
  publish:
    if: github.ref_type == 'tag'
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit that has been merged."
            exit 1
          fi
      - name: Tag version equals packages/mcp/package.json version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG_NAME#mcp-v}"
          PKG_VERSION="$(node -p "require('./packages/mcp/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG_NAME says $TAG_VERSION but packages/mcp/package.json says $PKG_VERSION. Fix one, re-tag."
            exit 1
          fi
          echo "Publishing @storyos/mcp $PKG_VERSION"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      # Workspace deps (@storyos/schemas, @storyos/sdk) resolve through
      # dist/ — they exist only once built. A clean CI checkout has no
      # dist/, so prepublishOnly's tsc cannot find them. Build first.
      - run: pnpm build
      - run: pnpm --filter @storyos/mcp bundle
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships an older
      # npm. Pin an exact version so a release never depends on whatever
      # "latest" is that day, then fail early if the install did not take.
      - name: Install npm 11.21.2
        run: npm install -g npm@11.21.2
      - name: npm supports trusted publishing (>= 11.5.1)
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm $NPM_VERSION"
          if [ "$(printf '%s\n' 11.5.1 "$NPM_VERSION" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $NPM_VERSION is older than 11.5.1, which cannot publish with trusted publishing."
            exit 1
          fi
      # pnpm packs the tarball (it rewrites workspace: ranges and adds the repo
      # LICENSE, exactly as `pnpm publish` did); npm publishes that tarball,
      # because only npm can exchange the OIDC identity for publish rights.
      - name: Publish @storyos/mcp
        working-directory: packages/mcp
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          npm publish "$RUNNER_TEMP/pack/"*.tgz --provenance --access public
