name: Publish @storyos/mcp to npm

# Publishes the MCP package when a tag like `mcp-v0.1.0` is pushed (or manually).
# Requires an NPM_TOKEN repo secret (npm automation token with publish rights to
# the @storyos scope). prepublishOnly builds + bundles a self-contained package.
on:
  push:
    tags:
      - 'mcp-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      # Workspace deps (@storyos/schemas, @storyos/sdk) resolve through
      # dist/ — they exist only once built. A clean CI checkout has no
      # dist/, so prepublishOnly's tsc cannot find them. Build first.
      - run: pnpm build
      - run: pnpm --filter @storyos/mcp publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
