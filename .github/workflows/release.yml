# Give a version name to images that already exist (#1126).
#
# A `v*` tag on a main commit adds `:<version>` to that commit's three
# `:<sha>` images, which build-images.yml published when the commit landed.
# Nothing is rebuilt, so a release is byte-identical to what staging ran and
# what deploy-production.yml ships by sha.
#
# The earlier version REBUILT api and web here and also pushed `:latest`.
# Its web build had none of build-images.yml's build args (PostHog, WEB_URL,
# GIT_SHA), it released no mcp image, and build-images.yml re-tags an unchanged
# service's `:latest` onto every new main commit, so one release would have
# put that differently-built web image into the next staging and production
# deploys. `:latest` is written only by build-images.yml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHA: ${{ github.sha }}
    steps:
      - name: The tag is a semver version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::tag '$GITHUB_REF_NAME' is not v<major>.<minor>.<patch>[-prerelease]"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: The tagged commit is on main
        run: |
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "::error::$SHA is not on main — only main commits have published images"; exit 1; }

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Check all three first, so a missing image tags nothing rather than some.
      - name: All three images exist for this sha
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for svc in api web mcp; do
            docker buildx imagetools inspect "ghcr.io/$owner/storyos-$svc:$SHA" > /dev/null \
              || { echo "::error::ghcr.io/$owner/storyos-$svc:$SHA not found — is the Build & push images run for this commit green?"; exit 1; }
            echo "ok: storyos-$svc:$SHA"
          done

      - name: Tag them ${{ steps.version.outputs.version }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for svc in api web mcp; do
            docker buildx imagetools create \
              -t "ghcr.io/$owner/storyos-$svc:$VERSION" \
              "ghcr.io/$owner/storyos-$svc:$SHA"
            echo "storyos-$svc:$VERSION -> $SHA"
          done
          {
            echo "### Release $VERSION"
            echo "api, web and mcp \`:$VERSION\` = \`:$SHA\` (no rebuild; \`:latest\` untouched)"
          } >> "$GITHUB_STEP_SUMMARY"
