# StoryOS self-host: `docker compose up -d` → app at http://localhost (port 80)
# Every long-lived service is `restart: unless-stopped` (MN-127): a crash, an OOM
# or a host reboot must not need a human. `unless-stopped`, not `always`, so a
# deliberate `docker compose stop` stays stopped.
# caddy serves web + API on ONE origin; /api/* routes to the api container.
# Full env matrix: docs/self-hosting.md
# S3-compatible attachment storage: `docker compose --profile minio up -d`
# PDF export renderer (OFF by default, isolated): `docker compose --profile pdf up -d`
#   with PDF_RENDERER_URL=http://gotenberg:3000 in .env — see docs/self-hosting.md
name: storyos

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: storyos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storyos}
      POSTGRES_DB: storyos
    volumes:
      - storyos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U storyos']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: storyos-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://storyos:${POSTGRES_PASSWORD:-storyos}@postgres:5432/storyos
      RUN_MIGRATIONS: 'true'
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (e.g. openssl rand -hex 32)}
      CONNECTIONS_MASTER_KEY: ${CONNECTIONS_MASTER_KEY:?set CONNECTIONS_MASTER_KEY in .env (e.g. openssl rand -hex 32)}
      API_URL: ${API_URL:-http://localhost:3001}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      ATTACHMENTS_DIR: /data/attachments
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-storyos-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-storyos}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-storyos-minio}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-StoryOS <noreply@localhost>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Managed StoryOS AI (agent runs + Architect proposals). Leave the key
      # empty to keep managed AI disabled; BYO-AI over MCP does not use it.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Deployment mode (#345). Hosted-vs-self-managed signal for the integration
      # catalog. Unset ⇒ derived from billing (hosted iff STRIPE_SECRET_KEY set),
      # so self-host needs nothing here. Set true/false only to override.
      STORYOS_HOSTED: ${STORYOS_HOSTED:-}
      # Billing (MN-165). All optional — unset = billing disabled, every workspace Free.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
      STRIPE_PRICE_SEAT: ${STRIPE_PRICE_SEAT:-}
      STRIPE_TAX_ENABLED: ${STRIPE_TAX_ENABLED:-false}
      # Server-side product analytics (#817). BOTH unset = the API makes no analytics call at
      # all, which is the default and what every self-hoster gets. Hosted StoryOS sets them.
      POSTHOG_PROJECT_TOKEN: ${POSTHOG_PROJECT_TOKEN:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      # OAuth for hosted-MCP connectors (MN-154). Off unless set true; needs oidc tables migrated.
      MCP_OAUTH: ${MCP_OAUTH:-}
      # GitHub App (#247). All optional — absent means the Connect flow is simply
      # unavailable and the app boots fine. Prefer the inline PEM (\n-escaped) in
      # GITHUB_APP_PRIVATE_KEY; the container can't read a host file path unless you
      # also mount it, so GITHUB_APP_PRIVATE_KEY_FILE must point at a path INSIDE the
      # container (see the commented volume below).
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_FILE: ${GITHUB_APP_PRIVATE_KEY_FILE:-}
      # The App's ONE webhook secret (whsec_…), set once at App registration.
      # When set, inbound deliveries verify against it and resolve the workspace by
      # the payload's installation.id — no per-workspace secret. Absent → the
      # legacy per-workspace webhook_secret path stays in effect.
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      # Platform-admin bootstrap (MN-104/#304). Optional — seeds this email as a
      # platform admin on API boot if a matching user already exists; otherwise
      # logs a warning and retries on the next boot. Once your first admin
      # exists, grant/revoke further admins from /admin itself rather than
      # rotating this var.
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      # PDF export (#262/#794/#874). Empty = PDF export is simply "not configured":
      # the export route answers 503 `pdf_export_not_configured` and /capabilities
      # says `available: false` — the normal, documented state, not a fault. To
      # enable: start the `pdf` profile AND set this to http://gotenberg:3000.
      # The two numeric knobs (PDF_RENDER_TIMEOUT_MS, PDF_RENDER_MAX_PENDING) are
      # deliberately NOT passed through: an empty value would coerce to 0 and the
      # API would refuse to boot. Set them in an override file if you need them.
      PDF_RENDERER_URL: ${PDF_RENDERER_URL:-}
    # `default` is listed explicitly because naming ANY network drops the implicit one.
    # `pdf` is the renderer's isolated network (below); it is empty unless the `pdf`
    # profile is on.
    networks:
      - default
      - pdf
    volumes:
      - storyos_attachments:/data/attachments
      # To use GITHUB_APP_PRIVATE_KEY_FILE instead of the inline key, mount the PEM
      # read-only and set GITHUB_APP_PRIVATE_KEY_FILE=/run/secrets/github-app.pem :
      # - ./github-app.pem:/run/secrets/github-app.pem:ro

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Empty = same-origin: the web bundle calls /api/v1/* relative to the page,
        # and caddy routes it. Set an absolute URL only for split-origin setups.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        # #163: self-host sets NEXT_PUBLIC_MCP_URL to their own MCP origin (e.g.
        # https://mcp.your-domain.com) so the Connect page shows the right endpoint;
        # unset = the hosted default (mcp.storyos.dev). Baked at build time.
        NEXT_PUBLIC_MCP_URL: ${NEXT_PUBLIC_MCP_URL:-}
        # PostHog analytics. NEXT_PUBLIC_* are baked into the client bundle at
        # BUILD time, so they must be passed as build args. No default token —
        # analytics is opt-in. Set your own PostHog project token in .env to
        # enable it; leave it unset to disable analytics entirely.
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        # #593 — same WEB_URL as the runtime environment: below, also passed as a
        # build arg: metadataBase is read at BUILD time for statically prerendered
        # pages (/, /login, /signup, …), which the runtime-only env never reaches.
        WEB_URL: ${WEB_URL:-http://localhost:3000}
    image: storyos-web:latest
    restart: unless-stopped
    environment:
      # Also exposed at runtime for server-side capture (posthog-node).
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      # #566 — the public origin, for next/metadata's metadataBase (og:image/
      # twitter:image on every page; a shared /v/[token] link is the first
      # page whose whole purpose is to be unfurled, which is what turned this
      # long-standing gap into a real defect).
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      # #566 — a server-side (Node) fetch from inside THIS container to the api
      # service, e.g. generateMetadata resolving a public view's token. Always
      # the compose-internal address, regardless of API_URL/NEXT_PUBLIC_API_URL
      # (same-origin's '' is relative and only resolvable by a BROWSER) —
      # mirrors the mcp service's own STORYOS_URL default below.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
    depends_on:
      - api

  # Hosted MCP endpoint (Streamable HTTP). Route a subdomain to it in your Caddy
  # TLS drop-in, e.g. mcp.your-domain.com → mcp:3002. Auth is per-request: each
  # client sends its own StoryOS PAT in the Authorization header.
  mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    image: storyos-mcp:latest
    restart: unless-stopped
    depends_on:
      - api
    environment:
      STORYOS_URL: ${MCP_STORYOS_URL:-http://api:3001}
      # Public web origin, for the `url` field on record responses (#268) — same
      # var the web/api services use, so a self-host deploy only sets it once.
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      PORT: '3002'
      # OAuth discovery advertising (MN-154). Set true once the AS (api) has MCP_OAUTH on.
      MCP_OAUTH: ${MCP_OAUTH:-}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://mcp.storyos.dev}
      # Better Auth's mounted base URL, not just the app origin.
      MCP_AUTH_SERVER: ${MCP_AUTH_SERVER:-https://app.storyos.dev/api/v1/auth}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    healthcheck:
      # A crashed proxy is caught by `restart`; a HUNG one is only caught here.
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - web
      - api
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/tls.d:/etc/caddy/tls.d:ro
      - ./docker/certs:/etc/caddy/certs:ro
      - storyos_caddy:/data
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'

  minio:
    image: minio/minio:latest
    profiles: [minio]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-storyos}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-storyos-minio}
    volumes:
      - storyos_minio:/data
    ports:
      - '9000:9000'
      - '9001:9001'

  # PDF renderer (#874): Gotenberg, a headless Chromium in its own container.
  #
  # THE ISOLATION IS THE POINT. Option A (#794) was chosen over a hosted service so
  # document content never leaves our infrastructure; a Chromium that can also reach
  # the internet would be a hosted service we happen to run ourselves. So:
  #  - it is attached ONLY to the `pdf` network, which is `internal: true` (no route
  #    out), and it publishes NO ports;
  #  - the API posts a self-contained HTML body with every asset already inlined, so
  #    the browser has nothing to fetch. If a render is ever missing an image, fix the
  #    HTML — do NOT "fix" it by giving this container internet.
  #
  # OFF by default (profile `pdf`, like minio): nothing here is started or pulled
  # until someone runs `docker compose --profile pdf up -d`. The image is PULLED, never
  # built on the host (build-images.yml: the production box has OOMed on a build).
  # Tag is pinned — not `latest`; bump it deliberately.
  gotenberg:
    image: gotenberg/gotenberg:8.38.1
    profiles: [pdf]
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - pdf
    environment:
      # One conversion at a time (default is 6): renders queue instead of fanning out
      # into parallel Chromium tabs on a 4 GB host. The API serialises too; this makes
      # the sidecar safe on its own.
      CHROMIUM_MAX_CONCURRENCY: '1'
      # MUST stay BELOW the API's PDF_RENDER_TIMEOUT_MS (default 30000). If the API
      # gave up first, the abandoned render would keep this single Chromium slot busy.
      # Gotenberg answers 503 at its own deadline, which the API reports as a 504.
      API_TIMEOUT: ${GOTENBERG_API_TIMEOUT:-25s}
      # The generated HTML carries no script; nothing here needs JavaScript.
      CHROMIUM_DISABLE_JAVASCRIPT: 'true'
      # Features we never use, and that make the server fetch things for a caller.
      API_DISABLE_DOWNLOAD_FROM: 'true'
      WEBHOOK_DISABLE: 'true'
      LIBREOFFICE_DISABLE_ROUTES: 'true'

networks:
  # Renderer-only network with NO route to the outside (#874 AC2). Declared internal
  # here; whether it IS internal is checked from inside the running container, not
  # assumed from this file.
  pdf:
    internal: true

volumes:
  storyos_pg:
  storyos_attachments:
  storyos_minio:
  storyos_caddy:
